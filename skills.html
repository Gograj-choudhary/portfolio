<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Section</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .skills-section {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .skills-section h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d1b2;
        }

        .skills-list {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
        }

        .skill {
            display: flex;
            align-items: center;
            background-color: #1e1e1e;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .skill:hover {
            transform: scale(1.05);
        }

        .skill img {
            width: 30px;
            height: 30px;
            margin-right: 10px;
        }

        .skill span {
            font-size: 1rem;
        }

        .dsa-section {
            text-align: center;
            margin-top: 30px;
        }

        .dsa-section a {
            text-decoration: none;
            color: #00d1b2;
            font-weight: bold;
            border: 2px solid #00d1b2;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        .dsa-section a:hover {
            background-color: #00d1b2;
            color: #121212;
        }
    </style>
</head>
<body>
    <div class="skills-section">
        <h2>My Skills</h2>

        <div class="skills-list">
            <!-- Frontend Skills -->
            <div class="skill">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML Logo">
                <span>HTML</span>
            </div>
            <div class="skill">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" alt="CSS Logo">
                <span>CSS</span>
            </div>
            <div class="skill">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JavaScript Logo">
                <span>JavaScript</span>
            </div>

            <!-- Backend Skills -->
            <div class="skill">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg" alt="Node.js Logo">
                <span>Node.js</span>
            </div>
            <div class="skill">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mongodb/mongodb-original.svg" alt="MongoDB Logo">
                <span>MongoDB</span>
            </div>
            <div class="skill">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/express/express-original.svg" alt="Express.js Logo">
                <span>Express.js</span>
            </div>

            <!-- Other Skills -->
            <div class="skill">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python Logo">
                <span>Python</span>
            </div>
            <div class="skill">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/c/c-original.svg" alt="C Logo">
                <span>C</span>
            </div>
            <div class="skill">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/cplusplus/cplusplus-original.svg" alt="C++ Logo">
                <span>C++</span>
            </div>
        </div>

        <!-- DSA Section -->
        <div class="dsa-section">
            <h3>Data Structures & Algorithms</h3>
            <p>Check out my LeetCode profile to see my problem-solving journey:</p>
            <a href="https://leetcode.com/your-profile" target="_blank">My LeetCode Profile</a>
        </div>
    </div>
</body>
</html>
